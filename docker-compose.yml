version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurantos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: restaurant_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurantos_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/restaurant_os?schema=public
      JWT_SECRET: restaurant_jwt_access_secret_key_2026
      JWT_REFRESH_SECRET: restaurant_jwt_refresh_secret_key_2026
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy

  ai_service:
    build:
      context: ./ai-service
    container_name: restaurantos_ai
    restart: always
    ports:
      - '8000:8000'
    environment:
      PORT: 8000

volumes:
  postgres_data:
